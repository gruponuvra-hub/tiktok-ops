[project]
name = "tiktok-ops"
version = "0.1.0"
description = "Publicação orgânica e gestão de campanhas no TikTok via API oficial"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "boto3>=1.34",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-httpx>=0.30", "ruff>=0.4"]

[project.scripts]
tiktok-ops = "tiktok_ops.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"
